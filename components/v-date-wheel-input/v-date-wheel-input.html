<v-wheel-input [segments]="segments$$()"
               [isDisabled]="isDisabled()"
               [values]="segmentValues$$()"
               (valuesChange)="onSegmentValuesChange($event)">
  <ng-container v-prefix>
    <ng-content select="[v-prefix]" />
  </ng-container>
  <ng-container v-postfix>
    <ng-content select="[v-postfix]" />
  </ng-container>
</v-wheel-input>
